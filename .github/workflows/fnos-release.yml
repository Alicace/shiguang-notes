name: Publish fnOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix dsh-plugin ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate release version
        shell: bash
        run: |
          version="$(node -p "require('./src/native/metadata.json').appVersion")"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "metadata appVersion v${version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          }

      - name: Run tests
        run: npm test

      - name: Prepare Linux runtime
        shell: bash
        run: |
          runtime="${RUNNER_TEMP}/native-runtime"
          mkdir -p "${runtime}"
          npm install --prefix "${runtime}" --no-audit --no-fund \
            express@5.2.1 multer@2.1.1 qiniu@7.15.2 \
            react@19.1.1 react-dom@19.1.1 react-markdown@10.1.0 \
            remark-gfm@4.0.1 sharp@0.35.5
          echo "FNOS_RUNTIME_DIR=${runtime}" >> "${GITHUB_ENV}"

      - name: Install fnpack
        shell: bash
        run: |
          curl -fsSL \
            -o "${RUNNER_TEMP}/fnpack" \
            "https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64"
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  ${RUNNER_TEMP}/fnpack" \
            | sha256sum -c -
          chmod 755 "${RUNNER_TEMP}/fnpack"
          echo "FN_PACK_BIN=${RUNNER_TEMP}/fnpack" >> "${GITHUB_ENV}"

      - name: Build FPK
        shell: bash
        run: |
          npm run fnos:pack
          version="$(node -p "require('./src/native/metadata.json').appVersion")"
          asset="fnnotes-m0_${version}_x86_64.fpk"
          mv fnnotes-m0.fpk "${asset}"
          echo "APP_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "RELEASE_ASSET=${asset}" >> "${GITHUB_ENV}"

      - name: Generate update manifest
        shell: bash
        run: |
          REPOSITORY="${GITHUB_REPOSITORY}" \
          RELEASE_TAG="${GITHUB_REF_NAME}" \
          ASSET_NAME="${RELEASE_ASSET}" \
          FPK_PATH="${RELEASE_ASSET}" \
          MANIFEST_OUTPUT=version.json \
          node scripts/make-update-manifest.mjs

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${RELEASE_ASSET}" \
            version.json \
            --title "拾光便签 ${APP_VERSION}" \
            --generate-notes

      - name: Publish static version manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          content="$(base64 -w 0 version.json)"
          existing="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/version.json?ref=main" \
              --jq .sha 2>/dev/null || true
          )"
          if [[ -n "${existing}" ]]; then
            gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/contents/version.json" \
              -f message="chore: publish ${GITHUB_REF_NAME} version manifest" \
              -f content="${content}" \
              -f sha="${existing}" >/dev/null
          else
            gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/contents/version.json" \
              -f message="chore: publish ${GITHUB_REF_NAME} version manifest" \
              -f content="${content}" >/dev/null
          fi
